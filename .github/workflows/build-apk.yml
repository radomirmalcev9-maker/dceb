name: Build APK

# Ручной запуск: Actions -> Build APK -> Run workflow
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Вариант сборки"
        type: choice
        options:
          - debug
          - release
        default: debug

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build APK
        working-directory: android_client
        run: |
          chmod +x gradlew
          if [ "${{ inputs.variant }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
            SRC="app/build/outputs/apk/release/app-release-unsigned.apk"
            [ -f "$SRC" ] || SRC="app/build/outputs/apk/release/app-release.apk"
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
            SRC="app/build/outputs/apk/debug/app-debug.apk"
          fi
          mkdir -p "$GITHUB_WORKSPACE/builds"
          cp "$SRC" "$GITHUB_WORKSPACE/builds/DCEB-${{ inputs.variant }}.apk"
          ls -lh "$GITHUB_WORKSPACE/builds/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DCEB-${{ inputs.variant }}-apk
          path: builds/DCEB-${{ inputs.variant }}.apk
          if-no-files-found: error

      # Готовый APK коммитится обратно в ветку, чтобы его можно было
      # просто забрать через git pull / скачать с GitHub без артефактов.
      - name: Commit APK back to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f builds/DCEB-${{ inputs.variant }}.apk
          if git diff --cached --quiet; then
            echo "APK не изменился, коммит не нужен"
          else
            git commit -m "build: DCEB-${{ inputs.variant }}.apk (GitHub Actions run ${{ github.run_id }})"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
