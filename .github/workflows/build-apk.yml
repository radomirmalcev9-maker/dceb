name: Build APK

# Ручной запуск: Actions -> Build APK -> Run workflow
# (workflow_dispatch доступен только после попадания файла в ветку по умолчанию,
#  поэтому для этой рабочей ветки также включён запуск по push)
on:
  push:
    branches: ["arena/b567304c-dceb"]
    paths:
      - "android_client/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
    inputs:
      variant:
        description: "Вариант сборки"
        type: choice
        options:
          - debug
          - release
        default: debug

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build APK
        working-directory: android_client
        env:
          VARIANT: ${{ inputs.variant || 'debug' }}
        run: |
          chmod +x gradlew
          if [ "$VARIANT" = "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
            SRC="app/build/outputs/apk/release/app-release-unsigned.apk"
            [ -f "$SRC" ] || SRC="app/build/outputs/apk/release/app-release.apk"
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
            SRC="app/build/outputs/apk/debug/app-debug.apk"
          fi
          mkdir -p "$GITHUB_WORKSPACE/builds"
          cp "$SRC" "$GITHUB_WORKSPACE/builds/DCEB-$VARIANT.apk"
          ls -lh "$GITHUB_WORKSPACE/builds/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DCEB-${{ inputs.variant || 'debug' }}-apk
          path: builds/DCEB-${{ inputs.variant || 'debug' }}.apk
          if-no-files-found: error

      # Готовый APK коммитится обратно в ветку, чтобы его можно было
      # просто забрать через git pull / скачать с GitHub без артефактов.
      # (путь builds/ не входит в push-триггер, повторного запуска не будет)
      - name: Commit APK back to branch
        env:
          VARIANT: ${{ inputs.variant || 'debug' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "builds/DCEB-$VARIANT.apk"
          if git diff --cached --quiet; then
            echo "APK не изменился, коммит не нужен"
          else
            git commit -m "build: DCEB-$VARIANT.apk (GitHub Actions run ${{ github.run_id }})"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
